name: Fresh install

# The README quick start, done by a machine the way a stranger would do it: a new Laravel application,
# the package from this checkout in place of Packagist, rpd:make:setup, the first module from the README,
# and then what must be true at the end — the form saves, the pages answer, the agent finds the guideline.
# Weekly as well: a dependency can move under the README while nothing here changes (Laravel 13.39 did).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    name: README quick start on a new Laravel application

    steps:
      - name: Checkout the package
        uses: actions/checkout@v4
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: A new Laravel application
        run: composer create-project laravel/laravel app --no-interaction --prefer-dist

      # The README says `composer require zofe/rapyd-admin:^9`. The same line, with this checkout answering
      # as 9.999.0 so that it wins over Packagist; copied, not symlinked, as a real install would be.
      - name: Require the package, from this checkout
        working-directory: app
        run: |
          composer config repositories.rapyd '{"type":"path","url":"../package","options":{"symlink":false,"versions":{"zofe/rapyd-admin":"9.999.0"}}}'
          composer require zofe/rapyd-admin:^9 --no-interaction

      - name: rpd:make:setup
        working-directory: app
        env:
          RAPYD_ADMIN_PASSWORD: fresh-install-ci
        run: php artisan rpd:make:setup --no-interaction

      - name: What setup has to leave behind
        working-directory: app
        run: |
          test -f config/livewire.php
          test -f config/rapyd.php
          test -f public/vendor/rapyd/rapyd.css
          test -f public/vendor/rapyd/img/favicon.svg
          test "$(grep -c "view('welcome')" routes/web.php)" = 0
          grep -q "'web', 'auth'" routes/web.php
          grep -q zofe/rapyd-admin boost.json

      - name: The first module, as in the README, seeded
        working-directory: app
        run: |
          php artisan rpd:make Articles Article --module=Blog --fields="title,body:text,published_at:datetime" --seed --icon=newspaper --no-interaction
          test -f app/Modules/Blog/Database/Factories/ArticleFactory.php
          php artisan tinker --execute='echo App\Modules\Blog\Models\Article::count();' | grep -q '^10$'

      # The test rpd:make wrote with the module, run as a reader would: the list behind auth and the permission,
      # the form saving what the factory makes (9.22.0 shipped with this broken and the package suite could not
      # see it), an operator in, a plain user out.
      - name: The generated test passes
        working-directory: app
        run: |
          test -f tests/Feature/Modules/Blog/ArticlesTest.php
          php artisan test

      - name: The pages, served
        working-directory: app
        run: |
          php artisan serve --port=8000 > serve.log 2>&1 &
          sleep 3
          curl -sf -o /dev/null http://127.0.0.1:8000/login
          curl -sf -o /dev/null http://127.0.0.1:8000/
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://127.0.0.1:8000/admin | grep -q '^302 .*/login'
          curl -sf -o /dev/null http://127.0.0.1:8000/vendor/rapyd/img/favicon.svg
          ! grep -i "exception\|error" serve.log

      # A fresh Laravel skeleton tells the agent to install Boost first: run without a terminal it has to
      # find the package in boost.json, or the agent learns nothing of Rapyd.
      - name: The guideline reaches an agent through Laravel Boost, without a terminal
        working-directory: app
        run: |
          composer require laravel/boost --dev --no-interaction
          php artisan boost:install --no-interaction
          # Boost writes the guideline to CLAUDE.md when the skeleton ships one, to AGENTS.md otherwise
          grep -l 'zofe/rapyd-admin/core' AGENTS.md CLAUDE.md
          test -d .claude/skills/rapyd-module
          test -d .claude/skills/rapyd-workflow

      # The installation looked at the way an agent would, at the end: nothing it calls a problem is allowed
      - name: rpd:doctor finds nothing wrong
        working-directory: app
        env:
          RAPYD_ADMIN_PASSWORD: fresh-install-ci
        run: php artisan rpd:doctor --fail
